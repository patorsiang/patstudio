# Repository checks, and the preview deploy that depends on them.
#
# The deploy lives here rather than in its own workflow because `needs:` between
# jobs is the only dependency GitHub actually enforces. As two workflows they
# raced, and a commit that failed CI still reached the preview URL.

name: CI

on:
  # Every branch, because work here is pushed straight to feature branches as
  # often as through a PR, and main itself is only built - never tested - by the
  # deploy workflow.
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # This name is the required status check on main. Renaming the job silently
    # disables branch protection, which keeps passing because nothing reports.
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest

    # The build and the e2e web server both list posts from the
    # thinking-in-public repo through api.github.com. Unauthenticated that
    # endpoint allows 60 requests/hour PER IP, and Actions runners share IPs, so
    # the budget is spent by unrelated jobs and the listing 403s at random - it
    # failed this required check on a PR that touched none of that code, and a
    # re-run of identical code passed. The token raises the limit to 5000/hour.
    #
    # Job-level rather than per-step because `build`, `test:e2e` and the app's
    # ISR path all reach the same fetch. `permissions: contents: read` above
    # already scopes it to reading, and thinking-in-public is public anyway.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun.lock is the only lockfile in this repo, and the only one anything
      # installs from. A stray yarn.lock / package-lock.json does not change a
      # single installed byte, which is exactly what makes it dangerous: security
      # scanners read it as the truth. legacy-v1/yarn.lock sat here pinning
      # next@14.2.1 - carrying a critical middleware auth bypass and a dozen
      # highs - long after the workspace actually resolved next@15.5.x. Snyk
      # dutifully failed on a version nobody had installed.
      #
      # A phantom lockfile is worse than no lockfile: it produces confident,
      # specific, wrong answers.
      - name: Reject stray lockfiles
        run: |
          stray=$(git ls-files '*yarn.lock' '*package-lock.json' '*pnpm-lock.yaml')
          if [ -n "$stray" ]; then
            echo "::error::Non-bun lockfile(s) committed - bun.lock is the only source of truth:"
            echo "$stray"
            exit 1
          fi

      # Ordered cheapest-first so an obvious failure reports in seconds rather
      # than after a full build.
      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Deliberately placed AFTER the code checks, unlike everything above it.
      # This step is the one whose result changes with no commit: a new advisory
      # against any dev-only transitive package turns every branch red on its
      # own schedule. Run first, it masked real typecheck and test failures
      # behind an unrelated upstream disclosure. Run here, a broken build still
      # reports as a broken build.
      #
      # It stays inside `checks` - and so still gates deploy-preview - on
      # purpose: the whole point is that a dead upstream release line fails the
      # build rather than waiting for someone to audit by hand, which is exactly
      # how next@16.2.x sat unpatched past the August 2026 security release.
      #
      # The script carries an --ignore list of advisories with no fix available.
      # Each one is justified in docs/architecture/code-quality.md; extend that
      # register before extending the list, never the other way round.
      - name: Audit dependencies
        run: bun run security:audit

      # The accessibility rules no unit test covers: tap target height, and text
      # and focus-ring contrast in both themes. The cv-engine tests would pass
      # just as happily with every control 8px tall and every label the same
      # colour as its background. These render the app and measure, so unlike
      # static checks they see a control with no height class at all, and a
      # colour pair nobody thought to list in the token table.
      #
      # Chromium only; the config pins both viewports to it.
      # `bunx playwright` ignores the lockfile and fetches whatever npm calls
      # latest, so it installed browsers for a different Playwright than the one
      # that then runs the tests. The day 1.63.0 shipped, CI installed 1.63.0's
      # chromium and the pinned 1.62.1 runner went looking for a build id that
      # was never downloaded: "Executable doesn't exist at
      # .../chromium_headless_shell-1234". Nothing in the repo had changed.
      #
      # This script runs the workspace's own playwright, so the browser and the
      # runner are always the same version bun.lock resolved.
      - name: Install Playwright browser
        run: bun run test:e2e:install

      # Builds the app again rather than reusing the step above, so the config
      # stays runnable from a cold checkout and does not silently depend on CI
      # step order.
      - name: Test accessibility (tap targets, contrast)
        run: bun run test:e2e

      # Storybook imports the components directly, so a rename or a changed prop
      # breaks it without touching the app build. Nothing else catches that.
      - name: Build Storybook
        run: bun run build:storybook

      # legacy-v1 sits in the workspace, so the root `overrides` block rewrites
      # its dependency tree as well - it lifts postcss off the exact pin
      # next@15 declares, and jumps uuid three majors for pdfjs. Nothing else in
      # this job touches it, so without these two steps an override tuned for
      # portfolio-web can break legacy-v1 and no one finds out.
      - name: Typecheck legacy-v1
        run: bun run typecheck:legacy

      - name: Build legacy-v1
        run: bun run build:legacy

  deploy-preview:
    name: Deploy portfolio-web to Vercel Preview
    runs-on: ubuntu-latest
    needs: checks
    # Any PR into main, or a manual run. Pushes to other branches get checks
    # only.
    #
    # This used to carry a third arm for pushes to feat/portfolio-platform-2026,
    # the branch the 2026 rebuild happened on. That branch was merged and has
    # been deleted, so the condition could never be true again - a ref
    # comparison against a branch that does not exist is silent dead code,
    # which is why it outlived the branch by three weeks.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Same shared-IP rate limit as the checks job; this one builds the app
      # locally, so it lists posts through api.github.com too.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: bun add -g vercel

      - name: Pull Vercel preview environment
        run: |
          vercel pull \
            --yes \
            --environment=preview \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build portfolio-web locally
        run: bun run build:portfolio

      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          url=$(vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "Preview URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
