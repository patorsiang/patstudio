name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-production:
    name: Deploy portfolio-web to Vercel Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: bun add -g vercel

      - name: Pull Vercel project settings
        # Token through env, not --token=: a flag value lands on the process
        # argv line, where anything else in the step can read it. Scoped to this
        # step rather than the job so dependency postinstall scripts run by
        # `bun install` never have the deploy token in their environment.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull \
            --yes \
            --environment=production

      - name: Build portfolio-web locally
        run: bun run build:portfolio

      - name: Deploy to Vercel Production
        id: deploy
        # Token through env, not --token=: a flag value lands on the process
        # argv line, where anything else in the step can read it. Scoped to this
        # step rather than the job so dependency postinstall scripts run by
        # `bun install` never have the deploy token in their environment.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prod)
          echo "Production URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
