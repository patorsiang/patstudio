# Read by SonarCloud's automatic analysis. sonar-project.properties is for the
# scanner CLI, which this repo doesn't run - and its projectKey predates the
# repo rename, so it describes a project that no longer exists.

# roleConfigs is one object literal per CV role with the same fields in the same
# order - similar by design, not copy-pasted logic. Duplication detection flagged
# the ai_ml_engineer entry as a clone of fullstack_engineer, so editing any line
# inside it counted as new duplicated code and failed the quality gate.
# The CV content data is the same shape for the same reason - one object per
# experience/project with en/th entries - and was 885 of the repo's 1,059
# duplicated lines (#90).
sonar.cpd.exclusions=packages/cv-engine/src/config.ts,packages/content/src/data/**

# Issues reviewed and accepted, each with the reason it is not a bug (#90).
sonar.issue.ignore.multicriteria=tw,namecard
# css:S8776 "Missing scoping root": `&::after` inside Tailwind v4's @utility is
# nested CSS that Tailwind expands to `.tap-reach::after`; Sonar's CSS parser
# does not know @utility, so it sees a bare `&`.
sonar.issue.ignore.multicriteria.tw.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.tw.resourceKey=app/src/app/globals.css
# typescript:S1082 on the namecard back face: adding a keyboard listener there
# either double-flips or flips under a focused link. Accepted trade-off -
# see the comment above that <div> and docs/design/namecard.md.
sonar.issue.ignore.multicriteria.namecard.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.namecard.resourceKey=app/src/components/organisms/NamecardFlip.tsx
