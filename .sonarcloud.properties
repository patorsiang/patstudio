# Read by SonarCloud's automatic analysis. sonar-project.properties is for the
# scanner CLI, which this repo doesn't run - and its projectKey predates the
# repo rename, so it describes a project that no longer exists.

# roleConfigs is one object literal per CV role with the same fields in the same
# order - similar by design, not copy-pasted logic. Duplication detection flagged
# the ai_ml_engineer entry as a clone of fullstack_engineer, so editing any line
# inside it counted as new duplicated code and failed the quality gate.
sonar.cpd.exclusions=packages/cv-engine/src/config.ts
